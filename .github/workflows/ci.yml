name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # GitHub-hosted Ubuntu runners include Docker, which Testcontainers needs.
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B -ntp clean verify

  frontend:
    name: Frontend (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check
        working-directory: frontend
        run: npx tsc -b
      - name: Lint
        working-directory: frontend
        run: npx oxlint src
      - name: Unit tests
        working-directory: frontend
        run: npx vitest run
      - name: Build
        working-directory: frontend
        run: npx vite build
