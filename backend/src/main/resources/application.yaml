spring:
  application:
    name: farm-management

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    # SQL logging is noisy and can leak data in production logs; enable it only
    # in the `dev` profile (SPRING_PROFILES_ACTIVE=dev) when debugging locally.
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true