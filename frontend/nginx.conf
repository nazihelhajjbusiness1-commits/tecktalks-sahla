server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # React Router handles routing client-side, so unknown paths (e.g. a
    # deep link or a page refresh on /dashboard) must fall back to
    # index.html instead of nginx returning a 404.
    location / {
        try_files $uri /index.html;
    }
}
